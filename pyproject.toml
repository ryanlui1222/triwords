[project]
name = "triwords-daily"
version = "0.2.0"
description = "Personal tri-language vocabulary PWA"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "libsql>=0.1.0",
  "turso_serverless",
  "google-genai>=1.0,<3"
]

[tool.vercel]
entrypoint = "app:app"
